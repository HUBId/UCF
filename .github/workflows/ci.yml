name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo build
        run: cargo build --workspace --all-targets
      - name: Cargo test
        run: PROPTEST_CASES=256 cargo test --workspace --all-targets
      - name: Cargo test (sandbox-wasm)
        run: PROPTEST_CASES=256 cargo test --workspace --features sandbox-wasm
      - name: Cargo test (sandbox-proc)
        run: PROPTEST_CASES=256 cargo test --workspace --features sandbox-proc
      - name: Cargo test (quiet)
        run: cargo test -q

      - name: Fuzz targets compile (stable smoke)
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
