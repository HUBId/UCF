name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: SDK API snapshot check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/sdk_api_snapshot.py check --baseline-ref "${{ github.event.pull_request.base.sha }}"
          else
            python scripts/sdk_api_snapshot.py check --baseline-ref "${{ github.event.before }}"
          fi
      - name: Determinism scan
        run: cargo run -p ucf-ops -- determinism scan
      - name: Audit scan
        run: cargo run -p ucf-ops -- audit scan
      - name: Hardware assumptions scan
        run: cargo run -p ucf-ops -- audit hardware-scan
      - name: Runtime path hygiene scan
        run: cargo run -p ucf-ops -- audit path-scan
      - name: Models verify
        run: cargo run -p ucf-ops -- models verify --manifest models/manifest.toml
      - name: Models probe (fixtures)
        run: cargo run -p ucf-ops -- models probe --manifest models/manifest.toml --out ./out/probe_report.json
      - name: Build ucf-ops
        run: cargo build -p ucf-ops
      - name: Docs lint (blocking)
        run: cargo run -p ucf-ops -- docs lint --strict --out ./out/docs_lint_report.json
      - name: Change impact plan (informational)
        run: |
          cargo run -p ucf-ops -- change-impact --base HEAD~1 --head HEAD --out ./out/change_impact_plan.md --json-out ./out/change_impact_plan.json
      - name: Upload change impact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-impact-plan
          path: |
            out/change_impact_plan.md
            out/change_impact_plan.json
            out/docs_lint_report.json

      - name: Cargo test workspace
        run: PROPTEST_CASES=128 cargo test --workspace --all-targets
      - name: Cargo test no-default-features
        run: PROPTEST_CASES=128 cargo test --workspace --all-targets --no-default-features
      - name: Readiness gate
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out_gate/gate_report.json --workdir ./.ucf_gate
      - name: Portability check (linux)
        run: cargo run -p ucf-ops -- portability check --out ./out/portability_linux.json
      - name: RC1 gate
        run: cargo run -p ucf-ops -- release rc1-gate --out ./out_gate/rc1_gate.json

  portability-gate:
    name: portability-gate-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo test workspace
        run: cargo test --workspace --all-targets
      - name: Docs lint (blocking)
        run: cargo run -p ucf-ops -- docs lint --strict --out ./out/docs_lint_report.json
      - name: Hardware assumptions scan
        run: cargo run -p ucf-ops -- audit hardware-scan
      - name: Runtime path hygiene scan
        run: cargo run -p ucf-ops -- audit path-scan
      - name: Portability check
        run: cargo run -p ucf-ops -- portability check --out ./out/portability.json
      - name: Readiness gate (test profile)
        if: runner.os == 'Linux'
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out/gate_report.json --workdir ./.ucf_gate
      - name: Readiness smoke (windows)
        if: runner.os == 'Windows'
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out/gate_report_windows.json --workdir ./.ucf_gate_windows

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: default
            features: ""
            blocking: true
          - name: candle-cpu
            features: "compute-candle,llm-candle,lfm-candle"
            blocking: false
          - name: burn-cpu
            features: "compute-burn,backend-burn,llm-burn,lfm-burn"
            blocking: false
          - name: stage-isolation
            features: "sandbox-wasm,stage-isolation"
            blocking: false
          - name: gpu-cuda
            package: "ucf-runtime"
            features: "compute-candle,lfm-candle,gpu-cuda"
            blocking: false
          - name: ebm-train
            package: "ucf-ebm-train"
            features: "ebm-train"
            blocking: false
    continue-on-error: ${{ matrix.lane.blocking == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test lane ${{ matrix.lane.name }}
        run: |
          if [ -n "${{ matrix.lane.package }}" ]; then
            cargo test -p "${{ matrix.lane.package }}" --all-targets --features "${{ matrix.lane.features }}"
          elif [ -z "${{ matrix.lane.features }}" ]; then
            cargo test --workspace --all-targets
          else
            cargo test --workspace --all-targets --features "${{ matrix.lane.features }}"
          fi
