name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: SDK API snapshot check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/sdk_api_snapshot.py check --baseline-ref "${{ github.event.pull_request.base.sha }}"
          else
            python scripts/sdk_api_snapshot.py check --baseline-ref "${{ github.event.before }}"
          fi
      - name: Determinism scan
        run: cargo run -p ucf-ops -- determinism scan
      - name: Audit scan
        run: cargo run -p ucf-ops -- audit scan
      - name: Hardware assumptions scan
        run: cargo run -p ucf-ops -- audit hardware-scan
      - name: Runtime path hygiene scan
        run: cargo run -p ucf-ops -- audit path-scan
      - name: Hidden network dependency scan
        run: cargo run -p ucf-ops -- audit net-deps --out ./out/net_deps.json
      - name: Models verify
        run: cargo run -p ucf-ops -- models verify --manifest models/manifest.toml
      - name: Models probe (fixtures)
        run: cargo run -p ucf-ops -- models probe --manifest models/manifest.toml --out ./out/probe_report.json
      - name: Build ucf-ops
        run: cargo build -p ucf-ops
      - name: Docs lint (blocking)
        run: cargo run -p ucf-ops -- docs lint --strict --out ./out/docs_lint_report.json
      - name: Path scan (blocking)
        run: cargo run -p ucf-ops -- audit path-scan
      - name: Hardware-neutral scan (blocking)
        run: cargo run -p ucf-ops -- audit hardware-scan
      - name: Artifact schema snapshot check (blocking)
        run: cargo run -p ucf-ops -- spec artifact-schemas-check --out ./out/artifact_schema_check.json
      - name: Governance stabilization sweep smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- governance-stabilization-sweep --out ./out/governance_stabilization_sweep.json --workdir . || {
            code=$?
            if [ "$code" -eq 1 ] || [ "$code" -eq 2 ]; then
              echo "governance_stabilization_sweep=skip reason=optional_scope_path_unavailable"
            else
              exit "$code"
            fi
          }
      - name: Governance stabilization sweep smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- governance-stabilization-sweep --out ./out/governance_stabilization_sweep.json --workdir .
          if ($LASTEXITCODE -eq 1 -or $LASTEXITCODE -eq 2) { Write-Host "governance_stabilization_sweep=skip reason=optional_scope_path_unavailable"; exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Governance primary surfaces smoke
        run: cargo run -p ucf-ops -- governance-surfaces-check --out ./out/governance_surfaces_check.json
      - name: Governance entry smoke
        run: cargo run -p ucf-ops -- governance-entry-check --out ./out/governance_entry_check.json
      - name: Supported set review smoke (prereq)
        run: cargo run -p ucf-ops -- models supported-set-review --out ./out/supported_set_review.json --workdir .
      - name: Supported scope reevaluate smoke
        run: cargo run -p ucf-ops -- models supported-scope-reevaluate --out ./out/supported_scope_reeval.json --workdir .
      - name: Supported scope execute smoke
        run: cargo run -p ucf-ops -- models supported-scope-execute-v4 --out ./out/supported_scope_execute_v4.json --workdir .
      - name: Supported scope execute v12 smoke (linux)
