            fi
          }
      - name: Applied scope check smoke
        run: |
          cargo run -p ucf-ops -- models active-review-snapshot --out ./out/active_review_snapshot.json --workdir .
          cargo run -p ucf-ops -- models evidence-snapshot --out ./out/backend_evidence_snapshot.json --workdir .
          cargo run -p ucf-ops -- operator signoff --out ./out/operator_signoff.json --workdir .
          cargo run -p ucf-ops -- operator review-packet --out ./out/operator_review_packet.json --workdir .
          cargo run -p ucf-ops -- models applied-scope-check --out ./out/applied_scope_check.json --workdir .
      - name: Export normalize check smoke
        run: cargo run -p ucf-ops -- exports normalize-check --out ./out/export_normalize_check.json
      - name: Active review snapshot smoke
        run: cargo run -p ucf-ops -- models active-review-snapshot --out ./out/active_review_snapshot.json
      - name: Backend resolution smoke (optional second-slot path)
        shell: bash
        run: |
          slot=$(cargo run -p ucf-ops -- v4 gate --out ./out/v4_gate_report_for_slot.json 2>/dev/null >/dev/null || true; [ -f docs/sae_burn_resolution_v5.md ] && echo sae || echo ssm)
          cargo run -p ucf-ops -- models backend-resolution --slot "$slot" --out ./out/backend_resolution_${slot}.json || echo "backend_resolution=skip optional_second_slot_path_unavailable"
      - name: Repro pack build+verify smoke
        shell: bash
        run: |
          cargo run -p ucf-ops -- bringup --scenario fixtures/e2e/v0_flow_a.json --ticks 16 --workdir ./.ucf_portability_smoke --out ./out/portability_smoke_bringup
          run_json=$(ls -1 ./.ucf_portability_smoke/ess/runs/*.json | sort | tail -n1)
          run_id=$(basename "$run_json" .json)
          cargo run -p ucf-ops -- repro pack --run "$run_id" --out ./out/repro_portability.zip --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- repro verify --pack ./out/repro_portability.zip --out ./out/repro_verify_portability.json --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- exports roundtrip-check --in ./out/repro_portability.zip --out ./out/export_roundtrip_check.json
          cargo run -p ucf-ops -- exports bundle-spine-check --in ./out/repro_portability.zip --out ./out/bundle_spine_check.json
      - name: Bundle spine sweep smoke (linux)
        shell: bash
        run: |
          cargo run -p ucf-ops -- exports bundle-spine-sweep --out ./out/bundle_spine_sweep.json --workdir . || {
            code=$?
            if [ "$code" -eq 1 ]; then
              echo "bundle_spine_sweep=skip reason=optional_export_refs_unavailable"
            else
              exit "$code"
            fi
          }
      - name: Bugkit build smoke
        shell: bash
        run: |
          run_json=$(ls -1 ./.ucf_portability_smoke/ess/runs/*.json | sort | tail -n1)
          run_id=$(basename "$run_json" .json)
          mkdir -p ./.ucf_portability_smoke/out/$run_id
          cp ./out/portability_smoke_bringup/run_metadata.json ./.ucf_portability_smoke/out/$run_id/run_metadata.json
          cp ./out/portability_smoke_bringup/metrics_summary.json ./.ucf_portability_smoke/out/$run_id/metrics_summary.json
          cargo run -p ucf-ops -- bugkit build --run "$run_id" --out ./out/bugkit_portability.zip --workdir ./.ucf_portability_smoke
