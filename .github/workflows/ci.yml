name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo build
        run: cargo build --workspace --all-targets
      - name: Cargo test
        run: PROPTEST_CASES=256 cargo test --workspace --all-targets
      - name: Cargo test (sandbox-wasm)
        run: PROPTEST_CASES=256 cargo test --workspace --features sandbox-wasm
      - name: Cargo test (sandbox-proc)
        run: PROPTEST_CASES=256 cargo test --workspace --features sandbox-proc
      - name: Cargo test (quiet)
        run: cargo test -q

      - name: Bench smoke (control-loop)
        run: |
          mkdir -p bench/out
          cargo run -p ucf-bench -- control-loop --ticks 2000 --backend stub --isolation inproc --out bench/out/control-loop-smoke.json
      - name: Bench regression guard (smoke)
        run: |
          cargo run -p ucf-bench -- compare-baseline --baseline bench/baselines/linux-x86_64/baseline.json --current bench/out/control-loop-smoke.json --out bench/out/regression-report.json

      - name: Fuzz targets compile (stable smoke)
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

      - name: Determinism replay guard
        run: cargo run -p ucf-replay -- replay --fixture runtime/ucf-replay/fixtures/golden_replay_fixture.json --from 0 --to 100000 --mode compute --report replay_report.json

      - name: Ops bringup deterministic spine
        run: |
          rm -rf .ucf out
          cargo run -p ucf-ops -- bringup --scenario fixtures/e2e_scenario_a.json --ticks 32 --out ./out
          test -f out/metrics_summary.json
          test -f out/run_metadata_record.json
          python - <<'PY2'
import hashlib, pathlib
m = pathlib.Path('out/metrics_summary.json').read_bytes()
print('metrics_sha256_prefix=' + hashlib.sha256(m).hexdigest()[:12])
PY2

      - name: Ops readiness gate
        run: |
          rm -rf .ucf_gate out_gate
          cargo run -p ucf-ops -- readiness-gate --profile test --out ./out_gate/gate_report.json --workdir ./.ucf_gate
          test -f out_gate/gate_report.json
