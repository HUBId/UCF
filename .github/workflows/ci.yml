          cargo run -p ucf-ops -- primary-semantics-closure-sweep --out ./out/primary_semantics_closure_sweep.json || {
            code=$?
            if [ "$code" -eq 1 ] || [ "$code" -eq 2 ]; then
              echo "primary_semantics_closure_sweep=skip reason=optional_export_or_scope_path_unavailable"
            else
              exit "$code"
            fi
          }
      - name: Primary semantics closure sweep smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- primary-semantics-closure-sweep --out ./out/primary_semantics_closure_sweep.json
          if ($LASTEXITCODE -eq 1 -or $LASTEXITCODE -eq 2) { Write-Host "primary_semantics_closure_sweep=skip reason=optional_export_or_scope_path_unavailable"; exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: v0 gate (blocking)
        run: cargo run -p ucf-ops -- v0 gate --scenario fixtures/e2e/v0_flow_a.json --out ./out/v0_gate_report.json
      - name: v1 gate (blocking)
        run: cargo run -p ucf-ops -- v1 gate --out ./out/v1_gate_report.json
      - name: v2 gate (blocking)
        run: cargo run -p ucf-ops -- v2 gate --out ./out/v2_gate_report.json
      - name: Hardware assumptions scan
        run: cargo run -p ucf-ops -- audit hardware-scan
      - name: Runtime path hygiene scan
        run: cargo run -p ucf-ops -- audit path-scan
      - name: Hidden network dependency scan
        if: runner.os == 'Linux'
        run: cargo run -p ucf-ops -- audit net-deps --out ./out/net_deps.json
      - name: Backend evidence snapshot smoke
        run: cargo run -p ucf-ops -- models evidence-snapshot --out ./out/backend_evidence_snapshot.json
      - name: Operator signoff smoke
        run: cargo run -p ucf-ops -- operator signoff --out ./out/operator_signoff.json
      - name: Remediation codes doc generation check (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- docs remediation-codes --out ./out/remediation_codes_v1.generated.md
          diff -u docs/remediation_codes_v1.md ./out/remediation_codes_v1.generated.md
      - name: Remediation codes doc generation check (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- docs remediation-codes --out ./out/remediation_codes_v1.generated.md
          git diff --ignore-cr-at-eol --no-index --exit-code docs/remediation_codes_v1.md ./out/remediation_codes_v1.generated.md
      - name: Models verify (if manifest present)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f models/manifest.toml ]; then
            cargo run -p ucf-ops -- models verify --manifest models/manifest.toml --out ./out/models_verify_report.json
          elif [ -f models/MANIFEST.toml ]; then
            cargo run -p ucf-ops -- models verify --manifest models/MANIFEST.toml --out ./out/models_verify_report.json
          else
            echo "models_verify=skip reason=no_manifest"
          fi
      - name: Models verify (if manifest present)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "models/manifest.toml") {
            cargo run -p ucf-ops -- models verify --manifest models/manifest.toml --out ./out/models_verify_report.json
          } elseif (Test-Path "models/MANIFEST.toml") {
            cargo run -p ucf-ops -- models verify --manifest models/MANIFEST.toml --out ./out/models_verify_report.json
          } else {
            Write-Host "models_verify=skip reason=no_manifest"
          }
      - name: Models probe slots (dummy/offline)
        run: |
          cargo run -p ucf-ops -- models probe --slot llm --out ./out/probe_llm.json
          cargo run -p ucf-ops -- models probe --slot sae --out ./out/probe_sae.json
          cargo run -p ucf-ops -- models probe --slot world_jepa --out ./out/probe_world_jepa.json
      - name: Unified eligibility report (smoke)
        run: cargo run -p ucf-ops -- models eligibility --out ./out/models_eligibility_report.json
      - name: Strict check v3 (smoke)
        run: cargo run -p ucf-ops -- strict check --strict --out ./out/strict_check.json
      - name: Operator report (smoke)
        run: cargo run -p ucf-ops -- operator report --out ./out/operator_report.json
      - name: Interop consistency matrix smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- interop consistency-matrix --out ./out/interop_consistency_matrix.json || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "interop_consistency_matrix=skip reason=required_surfaces_missing_in_bounded_smoke"
            else
              exit "$code"
            fi
          }
      - name: Interop consistency matrix smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- interop consistency-matrix --out ./out/interop_consistency_matrix.json
          if ($LASTEXITCODE -eq 2) {
            Write-Host "interop_consistency_matrix=skip reason=required_surfaces_missing_in_bounded_smoke"
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Portability check
        run: cargo run -p ucf-ops -- portability check --out ./out/portability.json
      - name: Portability report (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- portability report --out ./out/portability_report.json || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "portability_report=skip reason=validation_failed"
            else
              exit "$code"
            fi
          }
      - name: Portability report (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- portability report --out ./out/portability_report.json
          if ($LASTEXITCODE -eq 2) {
            Write-Host "portability_report=skip reason=validation_failed"
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Workspace test evidence (linux)
        if: runner.os == 'Linux'
        run: cargo run -p ucf-ops -- workspace-test-check --out ./out/workspace_test_report.json
      - name: Readiness gate (test profile)
        if: runner.os == 'Linux'
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out/gate_report.json --workdir ./.ucf_gate --workspace-test-report ./out/workspace_test_report.json
      - name: Readiness smoke (windows)
        if: runner.os == 'Windows'
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out/gate_report_windows.json --workdir ./.ucf_gate_windows
      - name: Goldens verify
        run: |
          cargo run -p ucf-ops -- goldens verify --scenario golden_a --os ${{ runner.os }}
          cargo run -p ucf-ops -- goldens verify --scenario golden_b --os ${{ runner.os }}
          cargo run -p ucf-ops -- goldens verify --scenario golden_c --os ${{ runner.os }}
          cargo run -p ucf-ops -- goldens verify --scenario golden_d --os ${{ runner.os }}

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: default
            features: ""
            blocking: true
          - name: candle-cpu
            features: "compute-candle,llm-candle,lfm-candle"
            blocking: false
          - name: burn-cpu
            features: "compute-burn,backend-burn,llm-burn,lfm-burn"
            blocking: false
          - name: stage-isolation
            features: "sandbox-wasm,stage-isolation"
            blocking: false
          - name: gpu-cuda
            package: "ucf-runtime"
            features: "compute-candle,lfm-candle,gpu-cuda"
            blocking: false
          - name: ebm-train
            package: "ucf-ebm-train"
            features: "ebm-train"
            blocking: false
    continue-on-error: ${{ matrix.lane.blocking == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test lane ${{ matrix.lane.name }}
        run: |
          if [ -n "${{ matrix.lane.package }}" ]; then
            cargo test -p "${{ matrix.lane.package }}" --all-targets --features "${{ matrix.lane.features }}"
          elif [ -z "${{ matrix.lane.features }}" ]; then
            cargo test --workspace --all-targets
          else
            cargo test --workspace --all-targets --features "${{ matrix.lane.features }}"
          fi
