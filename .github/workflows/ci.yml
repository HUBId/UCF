name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: SDK API snapshot check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/sdk_api_snapshot.py check --baseline-ref "${{ github.event.pull_request.base.sha }}"
          else
            python scripts/sdk_api_snapshot.py check --baseline-ref "${{ github.event.before }}"
          fi
      - name: Determinism scan
        run: cargo run -p ucf-ops -- determinism scan
      - name: Audit scan
        run: cargo run -p ucf-ops -- audit scan
      - name: Hardware assumptions scan
        run: cargo run -p ucf-ops -- audit hardware-scan
      - name: Runtime path hygiene scan
        run: cargo run -p ucf-ops -- audit path-scan
      - name: Hidden network dependency scan
        run: cargo run -p ucf-ops -- audit net-deps --out ./out/net_deps.json
      - name: Models verify
        run: cargo run -p ucf-ops -- models verify --manifest models/manifest.toml
      - name: Models probe (fixtures)
        run: cargo run -p ucf-ops -- models probe --manifest models/manifest.toml --out ./out/probe_report.json
      - name: Build ucf-ops
        run: cargo build -p ucf-ops
      - name: Docs lint (blocking)
        run: cargo run -p ucf-ops -- docs lint --strict --out ./out/docs_lint_report.json
      - name: Artifact schema snapshot check (blocking)
        run: cargo run -p ucf-ops -- spec artifact-schemas-check --out ./out/artifact_schema_check.json
      - name: Governance primary surfaces smoke
        run: cargo run -p ucf-ops -- governance-surfaces-check --out ./out/governance_surfaces_check.json
      - name: Governance entry smoke
        run: cargo run -p ucf-ops -- governance-entry-check --out ./out/governance_entry_check.json
      - name: Supported set review smoke (prereq)
        run: cargo run -p ucf-ops -- models supported-set-review --out ./out/supported_set_review.json --workdir .
      - name: Supported scope execute smoke
        run: cargo run -p ucf-ops -- models supported-scope-execute --out ./out/supported_scope_execute_v3.json --workdir .
      - name: Supported set apply smoke
        run: cargo run -p ucf-ops -- models supported-set-apply --out ./out/supported_set_apply.json --workdir .
      - name: Readiness spine smoke
        shell: bash
        run: |
          cargo run -p ucf-ops -- readiness-spine-check --out ./out/readiness_spine_check.json || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "readiness_spine_check=skip reason=bounded_readiness_context_unavailable"
            else
              exit "$code"
            fi
          }
      - name: Applied scope check smoke
        run: |
          cargo run -p ucf-ops -- models active-review-snapshot --out ./out/active_review_snapshot.json --workdir .
          cargo run -p ucf-ops -- models evidence-snapshot --out ./out/backend_evidence_snapshot.json --workdir .
          cargo run -p ucf-ops -- operator signoff --out ./out/operator_signoff.json --workdir .
          cargo run -p ucf-ops -- operator review-packet --out ./out/operator_review_packet.json --workdir .
          cargo run -p ucf-ops -- models applied-scope-check --out ./out/applied_scope_check.json --workdir .
      - name: Export normalize check smoke
        run: cargo run -p ucf-ops -- exports normalize-check --out ./out/export_normalize_check.json
      - name: Active review snapshot smoke
        run: cargo run -p ucf-ops -- models active-review-snapshot --out ./out/active_review_snapshot.json
      - name: Backend resolution smoke (optional second-slot path)
        shell: bash
        run: |
          slot=$(cargo run -p ucf-ops -- v4 gate --out ./out/v4_gate_report_for_slot.json 2>/dev/null >/dev/null || true; [ -f docs/sae_burn_resolution_v5.md ] && echo sae || echo ssm)
          cargo run -p ucf-ops -- models backend-resolution --slot "$slot" --out ./out/backend_resolution_${slot}.json || echo "backend_resolution=skip optional_second_slot_path_unavailable"
      - name: Repro pack build+verify smoke
        shell: bash
        run: |
          cargo run -p ucf-ops -- bringup --scenario fixtures/e2e/v0_flow_a.json --ticks 16 --workdir ./.ucf_portability_smoke --out ./out/portability_smoke_bringup
          run_json=$(ls -1 ./.ucf_portability_smoke/ess/runs/*.json | sort | tail -n1)
          run_id=$(basename "$run_json" .json)
          cargo run -p ucf-ops -- repro pack --run "$run_id" --out ./out/repro_portability.zip --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- repro verify --pack ./out/repro_portability.zip --out ./out/repro_verify_portability.json --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- exports roundtrip-check --in ./out/repro_portability.zip --out ./out/export_roundtrip_check.json
          cargo run -p ucf-ops -- exports bundle-spine-check --in ./out/repro_portability.zip --out ./out/bundle_spine_check.json
      - name: Bugkit build smoke
        shell: bash
        run: |
          run_json=$(ls -1 ./.ucf_portability_smoke/ess/runs/*.json | sort | tail -n1)
          run_id=$(basename "$run_json" .json)
          mkdir -p ./.ucf_portability_smoke/out/$run_id
          cp ./out/portability_smoke_bringup/run_metadata.json ./.ucf_portability_smoke/out/$run_id/run_metadata.json
          cp ./out/portability_smoke_bringup/metrics_summary.json ./.ucf_portability_smoke/out/$run_id/metrics_summary.json
          cargo run -p ucf-ops -- bugkit build --run "$run_id" --out ./out/bugkit_portability.zip --workdir ./.ucf_portability_smoke
      - name: Remediation consistency smoke
        run: cargo run -p ucf-ops -- remediation-consistency-check --out ./out/remediation_consistency_portability.json
      - name: Remediation interop smoke
        run: cargo run -p ucf-ops -- remediation-interop-check --out ./out/remediation_interop_check.json
      - name: Remediation spine smoke
        run: cargo run -p ucf-ops -- remediation-spine-check --out ./out/remediation_spine_check.json
      - name: Backend evidence snapshot smoke
        run: cargo run -p ucf-ops -- models evidence-snapshot --out ./out/backend_evidence_snapshot.json
      - name: Operator signoff smoke
        run: cargo run -p ucf-ops -- operator signoff --out ./out/operator_signoff.json
      - name: Remediation codes doc generation check (blocking)
        run: |
          cargo run -p ucf-ops -- docs remediation-codes --out ./out/remediation_codes_v1.generated.md
          diff -u docs/remediation_codes_v1.md ./out/remediation_codes_v1.generated.md
      - name: v0 gate (blocking)
        run: cargo run -p ucf-ops -- v0 gate --scenario fixtures/e2e/v0_flow_a.json --out ./out/v0_gate_report.json
      - name: v1 gate (blocking)
        run: cargo run -p ucf-ops -- v1 gate --out ./out/v1_gate_report.json
      - name: v2 gate (blocking)
        run: cargo run -p ucf-ops -- v2 gate --out ./out/v2_gate_report.json
      - name: Unified eligibility report (smoke)
        run: cargo run -p ucf-ops -- models eligibility --out ./out/models_eligibility_report.json
      - name: Strict check v3 (smoke)
        run: cargo run -p ucf-ops -- strict check --strict --out ./out/strict_check.json
      - name: Operator report (smoke)
        run: cargo run -p ucf-ops -- operator report --out ./out/operator_report.json
      - name: Interop consistency matrix smoke
        shell: bash
        run: |
          cargo run -p ucf-ops -- interop consistency-matrix --out ./out/interop_consistency_matrix.json || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "interop_consistency_matrix=skip reason=required_surfaces_missing_in_bounded_smoke"
            else
              exit "$code"
            fi
          }
      - name: Change impact plan (informational)
        run: |
          cargo run -p ucf-ops -- change-impact --base HEAD~1 --head HEAD --out ./out/change_impact_plan.md --json-out ./out/change_impact_plan.json
      - name: Upload change impact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-impact-plan
          path: |
            out/change_impact_plan.md
            out/change_impact_plan.json
            out/docs_lint_report.json

      - name: Cargo test workspace
        run: PROPTEST_CASES=128 cargo test --workspace --all-targets
      - name: Cargo test no-default-features
        run: PROPTEST_CASES=128 cargo test --workspace --all-targets --no-default-features
      - name: Readiness gate
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out_gate/gate_report.json --workdir ./.ucf_gate
      - name: Portability check (linux)
        run: cargo run -p ucf-ops -- portability check --out ./out/portability_linux.json
      - name: Portability report (linux)
        run: cargo run -p ucf-ops -- portability report --out ./out/portability_report_linux.json
      - name: Goldens verify (linux)
        run: |
          cargo run -p ucf-ops -- goldens verify --scenario golden_a --os linux
          cargo run -p ucf-ops -- goldens verify --scenario golden_b --os linux
          cargo run -p ucf-ops -- goldens verify --scenario golden_c --os linux
          cargo run -p ucf-ops -- goldens verify --scenario golden_d --os linux
      - name: RC1 gate
        run: cargo run -p ucf-ops -- release rc1-gate --out ./out_gate/rc1_gate.json

  portability-gate:
    name: portability-gate-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo test workspace
        run: cargo test --workspace --all-targets
      - name: Docs lint (blocking)
        run: cargo run -p ucf-ops -- docs lint --strict --out ./out/docs_lint_report.json
      - name: Artifact schema snapshot check (blocking)
        run: cargo run -p ucf-ops -- spec artifact-schemas-check --out ./out/artifact_schema_check.json
      - name: Governance primary surfaces smoke
        run: cargo run -p ucf-ops -- governance-surfaces-check --out ./out/governance_surfaces_check.json
      - name: Governance entry smoke
        run: cargo run -p ucf-ops -- governance-entry-check --out ./out/governance_entry_check.json
      - name: Supported set review smoke (prereq)
        run: cargo run -p ucf-ops -- models supported-set-review --out ./out/supported_set_review.json --workdir .
      - name: Supported scope execute smoke
        run: cargo run -p ucf-ops -- models supported-scope-execute --out ./out/supported_scope_execute_v3.json --workdir .
      - name: Supported set apply smoke
        run: cargo run -p ucf-ops -- models supported-set-apply --out ./out/supported_set_apply.json --workdir .
      - name: Readiness spine smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- readiness-spine-check --out ./out/readiness_spine_check.json || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "readiness_spine_check=skip reason=bounded_readiness_context_unavailable"
            else
              exit "$code"
            fi
          }
      - name: Readiness spine smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- readiness-spine-check --out ./out/readiness_spine_check.json
          if ($LASTEXITCODE -eq 2) { Write-Host "readiness_spine_check=skip reason=bounded_readiness_context_unavailable"; exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scope authority check smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- scope authority-check --out ./out/scope_authority_check.json || {
            code=$?
            if [ "$code" -eq 1 ]; then
              echo "scope_authority_check=skip reason=optional_scope_path_unavailable"
            else
              exit "$code"
            fi
          }
      - name: Scope authority check smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- scope authority-check --out ./out/scope_authority_check.json
          if ($LASTEXITCODE -eq 1) { Write-Host "scope_authority_check=skip reason=optional_scope_path_unavailable"; exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Supported scope reevaluate smoke
        run: cargo run -p ucf-ops -- models supported-scope-reevaluate --out ./out/supported_scope_reeval.json --workdir .
      - name: Review-truth check smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- operator review-truth-check --out ./out/review_truth_check.json || {
            code=$?
            if [ "$code" -eq 2 ] || [ "$code" -eq 1 ]; then
              echo "review_truth_check=skip reason=optional_scope_path_unavailable"
            else
              exit "$code"
            fi
          }
      - name: Review-truth check smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- operator review-truth-check --out ./out/review_truth_check.json
          if ($LASTEXITCODE -eq 2 -or $LASTEXITCODE -eq 1) { Write-Host "review_truth_check=skip reason=optional_scope_path_unavailable"; exit 0 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Applied scope check smoke
        run: |
          cargo run -p ucf-ops -- models active-review-snapshot --out ./out/active_review_snapshot.json --workdir .
          cargo run -p ucf-ops -- models evidence-snapshot --out ./out/backend_evidence_snapshot.json --workdir .
          cargo run -p ucf-ops -- operator signoff --out ./out/operator_signoff.json --workdir .
          cargo run -p ucf-ops -- operator review-packet --out ./out/operator_review_packet.json --workdir .
          cargo run -p ucf-ops -- models applied-scope-check --out ./out/applied_scope_check.json --workdir .
      - name: Export normalize check smoke
        run: cargo run -p ucf-ops -- exports normalize-check --out ./out/export_normalize_check.json
      - name: Active review snapshot smoke
        run: cargo run -p ucf-ops -- models active-review-snapshot --out ./out/active_review_snapshot.json
      - name: Backend resolution smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo run -p ucf-ops -- models backend-resolution --slot sae --out ./out/backend_resolution_sae.json || echo "backend_resolution=skip optional_second_slot_path_unavailable"
      - name: Backend resolution smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- models backend-resolution --slot sae --out ./out/backend_resolution_sae.json
          if ($LASTEXITCODE -ne 0) { Write-Host "backend_resolution=skip optional_second_slot_path_unavailable"; exit 0 }
      - name: Repro pack build+verify smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- bringup --scenario fixtures/e2e/v0_flow_a.json --ticks 16 --workdir ./.ucf_portability_smoke --out ./out/portability_smoke_bringup
          run_json=$(ls -1 ./.ucf_portability_smoke/ess/runs/*.json | sort | tail -n1)
          run_id=$(basename "$run_json" .json)
          cargo run -p ucf-ops -- repro pack --run "$run_id" --out ./out/repro_portability.zip --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- repro verify --pack ./out/repro_portability.zip --out ./out/repro_verify_portability.json --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- exports roundtrip-check --in ./out/repro_portability.zip --out ./out/export_roundtrip_check.json
          cargo run -p ucf-ops -- exports bundle-spine-check --in ./out/repro_portability.zip --out ./out/bundle_spine_check.json
      - name: Repro pack build+verify smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- bringup --scenario fixtures/e2e/v0_flow_a.json --ticks 16 --workdir ./.ucf_portability_smoke --out ./out/portability_smoke_bringup
          $run_json = Get-ChildItem ".\.ucf_portability_smoke\ess\runs\*.json" | Sort-Object Name | Select-Object -Last 1
          if (-not $run_json) { throw "no run metadata json found under ./.ucf_portability_smoke/ess/runs" }
          $run_id = [System.IO.Path]::GetFileNameWithoutExtension($run_json.Name)
          cargo run -p ucf-ops -- repro pack --run $run_id --out ./out/repro_portability.zip --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- repro verify --pack ./out/repro_portability.zip --out ./out/repro_verify_portability.json --workdir ./.ucf_portability_smoke
          cargo run -p ucf-ops -- exports roundtrip-check --in ./out/repro_portability.zip --out ./out/export_roundtrip_check.json
          cargo run -p ucf-ops -- exports bundle-spine-check --in ./out/repro_portability.zip --out ./out/bundle_spine_check.json
      - name: Bugkit build smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          run_json=$(ls -1 ./.ucf_portability_smoke/ess/runs/*.json | sort | tail -n1)
          run_id=$(basename "$run_json" .json)
          mkdir -p ./.ucf_portability_smoke/out/$run_id
          cp ./out/portability_smoke_bringup/run_metadata.json ./.ucf_portability_smoke/out/$run_id/run_metadata.json
          cp ./out/portability_smoke_bringup/metrics_summary.json ./.ucf_portability_smoke/out/$run_id/metrics_summary.json
          cargo run -p ucf-ops -- bugkit build --run "$run_id" --out ./out/bugkit_portability.zip --workdir ./.ucf_portability_smoke
      - name: Bugkit build smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $run_json = Get-ChildItem ".\.ucf_portability_smoke\ess\runs\*.json" | Sort-Object Name | Select-Object -Last 1
          if (-not $run_json) { throw "no run metadata json found under ./.ucf_portability_smoke/ess/runs" }
          $run_id = [System.IO.Path]::GetFileNameWithoutExtension($run_json.Name)
          New-Item -ItemType Directory -Force -Path ".\.ucf_portability_smoke\out\$run_id" | Out-Null
          Copy-Item "./out/portability_smoke_bringup/run_metadata.json" ".\.ucf_portability_smoke\out\$run_id\run_metadata.json"
          Copy-Item "./out/portability_smoke_bringup/metrics_summary.json" ".\.ucf_portability_smoke\out\$run_id\metrics_summary.json"
          cargo run -p ucf-ops -- bugkit build --run $run_id --out ./out/bugkit_portability.zip --workdir ./.ucf_portability_smoke
      - name: Remediation consistency smoke
        run: cargo run -p ucf-ops -- remediation-consistency-check --out ./out/remediation_consistency_portability.json
      - name: Remediation interop smoke
        run: cargo run -p ucf-ops -- remediation-interop-check --out ./out/remediation_interop_check.json
      - name: Remediation spine smoke
        run: cargo run -p ucf-ops -- remediation-spine-check --out ./out/remediation_spine_check.json
      - name: v0 gate (blocking)
        run: cargo run -p ucf-ops -- v0 gate --scenario fixtures/e2e/v0_flow_a.json --out ./out/v0_gate_report.json
      - name: v1 gate (blocking)
        run: cargo run -p ucf-ops -- v1 gate --out ./out/v1_gate_report.json
      - name: v2 gate (blocking)
        run: cargo run -p ucf-ops -- v2 gate --out ./out/v2_gate_report.json
      - name: Hardware assumptions scan
        run: cargo run -p ucf-ops -- audit hardware-scan
      - name: Runtime path hygiene scan
        run: cargo run -p ucf-ops -- audit path-scan
      - name: Hidden network dependency scan
        if: runner.os == 'Linux'
        run: cargo run -p ucf-ops -- audit net-deps --out ./out/net_deps.json
      - name: Backend evidence snapshot smoke
        run: cargo run -p ucf-ops -- models evidence-snapshot --out ./out/backend_evidence_snapshot.json
      - name: Operator signoff smoke
        run: cargo run -p ucf-ops -- operator signoff --out ./out/operator_signoff.json
      - name: Remediation codes doc generation check (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- docs remediation-codes --out ./out/remediation_codes_v1.generated.md
          diff -u docs/remediation_codes_v1.md ./out/remediation_codes_v1.generated.md
      - name: Remediation codes doc generation check (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- docs remediation-codes --out ./out/remediation_codes_v1.generated.md
          git diff --ignore-cr-at-eol --no-index --exit-code docs/remediation_codes_v1.md ./out/remediation_codes_v1.generated.md
      - name: Models verify (if manifest present)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f models/manifest.toml ]; then
            cargo run -p ucf-ops -- models verify --manifest models/manifest.toml --out ./out/models_verify_report.json
          elif [ -f models/MANIFEST.toml ]; then
            cargo run -p ucf-ops -- models verify --manifest models/MANIFEST.toml --out ./out/models_verify_report.json
          else
            echo "models_verify=skip reason=no_manifest"
          fi
      - name: Models verify (if manifest present)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "models/manifest.toml") {
            cargo run -p ucf-ops -- models verify --manifest models/manifest.toml --out ./out/models_verify_report.json
          } elseif (Test-Path "models/MANIFEST.toml") {
            cargo run -p ucf-ops -- models verify --manifest models/MANIFEST.toml --out ./out/models_verify_report.json
          } else {
            Write-Host "models_verify=skip reason=no_manifest"
          }
      - name: Models probe slots (dummy/offline)
        run: |
          cargo run -p ucf-ops -- models probe --slot llm --out ./out/probe_llm.json
          cargo run -p ucf-ops -- models probe --slot sae --out ./out/probe_sae.json
          cargo run -p ucf-ops -- models probe --slot world_jepa --out ./out/probe_world_jepa.json
      - name: Unified eligibility report (smoke)
        run: cargo run -p ucf-ops -- models eligibility --out ./out/models_eligibility_report.json
      - name: Strict check v3 (smoke)
        run: cargo run -p ucf-ops -- strict check --strict --out ./out/strict_check.json
      - name: Operator report (smoke)
        run: cargo run -p ucf-ops -- operator report --out ./out/operator_report.json
      - name: Interop consistency matrix smoke (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p ucf-ops -- interop consistency-matrix --out ./out/interop_consistency_matrix.json || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "interop_consistency_matrix=skip reason=required_surfaces_missing_in_bounded_smoke"
            else
              exit "$code"
            fi
          }
      - name: Interop consistency matrix smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo run -p ucf-ops -- interop consistency-matrix --out ./out/interop_consistency_matrix.json
          if ($LASTEXITCODE -eq 2) {
            Write-Host "interop_consistency_matrix=skip reason=required_surfaces_missing_in_bounded_smoke"
            exit 0
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Portability check
        run: cargo run -p ucf-ops -- portability check --out ./out/portability.json
      - name: Portability report
        run: cargo run -p ucf-ops -- portability report --out ./out/portability_report.json
      - name: Readiness gate (test profile)
        if: runner.os == 'Linux'
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out/gate_report.json --workdir ./.ucf_gate
      - name: Readiness smoke (windows)
        if: runner.os == 'Windows'
        run: cargo run -p ucf-ops -- readiness-gate --profile test --out ./out/gate_report_windows.json --workdir ./.ucf_gate_windows
      - name: Goldens verify
        run: |
          cargo run -p ucf-ops -- goldens verify --scenario golden_a --os ${{ runner.os }}
          cargo run -p ucf-ops -- goldens verify --scenario golden_b --os ${{ runner.os }}
          cargo run -p ucf-ops -- goldens verify --scenario golden_c --os ${{ runner.os }}
          cargo run -p ucf-ops -- goldens verify --scenario golden_d --os ${{ runner.os }}

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: default
            features: ""
            blocking: true
          - name: candle-cpu
            features: "compute-candle,llm-candle,lfm-candle"
            blocking: false
          - name: burn-cpu
            features: "compute-burn,backend-burn,llm-burn,lfm-burn"
            blocking: false
          - name: stage-isolation
            features: "sandbox-wasm,stage-isolation"
            blocking: false
          - name: gpu-cuda
            package: "ucf-runtime"
            features: "compute-candle,lfm-candle,gpu-cuda"
            blocking: false
          - name: ebm-train
            package: "ucf-ebm-train"
            features: "ebm-train"
            blocking: false
    continue-on-error: ${{ matrix.lane.blocking == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test lane ${{ matrix.lane.name }}
        run: |
          if [ -n "${{ matrix.lane.package }}" ]; then
            cargo test -p "${{ matrix.lane.package }}" --all-targets --features "${{ matrix.lane.features }}"
          elif [ -z "${{ matrix.lane.features }}" ]; then
            cargo test --workspace --all-targets
          else
            cargo test --workspace --all-targets --features "${{ matrix.lane.features }}"
          fi
