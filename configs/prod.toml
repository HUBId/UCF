strict_mode = false
profile_name = "prod"
policy_overlay = "prod"
device_profile = "large"

[slot_modes]
ebm = "shadow"

[paths]
policy_pack = "policies/packs/base_v1"
policy_overlay = "policies/packs/overlays/prod"
models_manifest = "models/manifest.toml"

[strictness]
determinism_lock = true
stage_isolation = true

[runtime]
backend_pack = "worker_v1"
offline = true
compute_backend = "burn"
compute_seed = 659918
capabilities_default = "deny"
sampling_enabled = false
docs_lint_required = true
isolation_runtime = "inproc"
log_level = "warn"
llm_max_tokens = 192
probe_timeout_ms = 250

[active_evidence]
freshness_probe_max_age_ticks = 256
freshness_compare_max_age_ticks = 256
freshness_no_impact_max_age_ticks = 256
freshness_drift_status_max_age_ticks = 256
allow_warn_drift_for_active = false
require_matching_target_hash = true
