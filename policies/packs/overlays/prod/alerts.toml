schema_version = 1

[[rules]]
id = "degraded_fallback_rate"
kind = "DegradedFallbackRate"
window_size = 512
threshold = 16
clear_after_windows = 2
severity = "medium"
action = "recommend_disable_shadow"

[[rules]]
id = "drift_severe_rate"
kind = "DriftSevereRate"
window_size = 512
threshold = 4
clear_after_windows = 2
severity = "high"
action = "recommend_rollback"

[[rules]]
id = "gateway_auth_fail_rate"
kind = "GatewayAuthFailRate"
window_size = 512
threshold = 8
clear_after_windows = 2
severity = "high"
action = "require_operator"

[[rules]]
id = "strict_failure_present"
kind = "StrictFailurePresent"
window_size = 512
threshold = 1
clear_after_windows = 2
severity = "high"
action = "require_operator"
