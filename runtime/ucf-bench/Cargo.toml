[package]
name = "ucf-bench"
version = "0.1.0"
edition = "2021"

[features]
default = []
compute-candle = ["ucf-compute/compute-candle", "ucf-runtime/compute-candle"]
compute-burn = ["ucf-compute/compute-burn", "ucf-runtime/compute-burn"]
sandbox-wasm = ["ucf-runtime/sandbox-wasm"]
sandbox-proc = ["ucf-runtime/sandbox-proc"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
ucf-core = { path = "../../core/ucf-core" }
ucf-frames = { path = "../../domains/ucf-frames" }
ucf-compute = { path = "../ucf-compute" }
ucf-runtime = { path = "../ucf-runtime" }
ucf-policy = { path = "../ucf-policy" }
ucf-ess = { path = "../../domains/ucf-ess" }
hex = { workspace = true }

[dev-dependencies]
serde_json = "1"
