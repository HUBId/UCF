[package]
name = "ucf-ops"
version = "0.1.0"
edition = "2021"

[features]
default = []
formal-smt = []

[dependencies]
ucf-runtime = { path = "../ucf-runtime" }
ucf-replay = { path = "../ucf-replay" }
ucf-compute = { path = "../ucf-compute" }
ucf-policy = { path = "../ucf-policy" }
ucf-core = { path = "../../core/ucf-core" }
ucf-frames = { path = "../../domains/ucf-frames" }
ucf-ess = { path = "../../domains/ucf-ess" }
ucf-types = { path = "../../core/crates/ucf-types" }
ucf-platform = { path = "../ucf-platform" }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
tempfile = "3"
regex = "1"

[dev-dependencies]
