[package]
name = "ucf-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.12"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
blake3 = "1"
hex = { workspace = true }
ucf-core = { path = "../../core/ucf-core" }
ucf-frames = { path = "../../domains/ucf-frames" }
ucf-runtime = { path = "../ucf-runtime" }
ucf-policy = { path = "../ucf-policy" }
ucf-ess = { path = "../../domains/ucf-ess" }
ucf-ops = { path = "../ucf-ops" }
ucf-evidence = { path = "../../core/crates/ucf-evidence" }
ucf-archive-store = { path = "../../domains/archive/crates/ucf-archive-store" }
ucf-protocol = { package = "ucf-protocol", path = "../../protocol/crates/ucf-protocol" }
ucf-types = { path = "../../core/crates/ucf-types" }

[build-dependencies]
prost-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
