[package]
name = "ucf-compute"
version = "0.1.0"
edition = "2021"

[features]
default = ["compute-stub"]
compute-stub = []
compute-candle = []
compute-burn = []

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
hex = { workspace = true }
ucf-frames = { path = "../../domains/ucf-frames" }
ucf-core = { path = "../../core/ucf-core" }

[dev-dependencies]
serde_json = "1"
