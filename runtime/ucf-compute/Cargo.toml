[package]
name = "ucf-compute"
version = "0.1.0"
edition = "2021"

[features]
default = ["backend-stub", "backend-toy"]
backend-stub = []
backend-toy = []
backend-candle = ["dep:candle-core"]
compute-stub = ["backend-stub"]
compute-candle = ["dep:candle-core", "backend-candle"]
compute-burn = []
backend-burn = ["compute-burn"]
llm-candle = ["dep:candle-core"]
llm-burn = []
lfm-candle = ["dep:candle-core"]
lfm-burn = []
lfm-lnn = []
plasticity = []
replay = []
ops-explain = []
remote-compute = []

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"
hex = { workspace = true }
metrics = { workspace = true }
tracing = { workspace = true }
libc = "0.2"
candle-core = { version = "0.8", default-features = false, optional = true }
safetensors = "0.4"
half = "2"
ucf-frames = { path = "../../domains/ucf-frames" }
ucf-core = { path = "../../core/ucf-core" }
ucf-types = { path = "../../core/crates/ucf-types" }

[dev-dependencies]
serde_json = "1"
proptest = "1"
tempfile = "3"
