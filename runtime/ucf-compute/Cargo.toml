[package]
name = "ucf-compute"
version = "0.1.0"
edition = "2021"

[features]
default = ["backend-stub", "backend-toy"]
backend-stub = []
backend-toy = []
compute-stub = ["backend-stub"]
compute-candle = ["dep:candle-core"]
compute-burn = []
backend-burn = ["compute-burn"]
llm-candle = ["dep:candle-core"]
llm-burn = []
lfm-candle = ["dep:candle-core"]
lfm-burn = []
lfm-lnn = []
plasticity = []
replay = []
ops-explain = []

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
hex = { workspace = true }
metrics = { workspace = true }
tracing = { workspace = true }
candle-core = { version = "0.8", default-features = false, optional = true }
ucf-frames = { path = "../../domains/ucf-frames" }
ucf-core = { path = "../../core/ucf-core" }
ucf-types = { path = "../../core/crates/ucf-types" }

[dev-dependencies]
serde_json = "1"
proptest = "1"
