[package]
name = "ucf-runtime"
version = "0.1.0"
edition = "2021"

[features]
default = []
compute-candle = ["ucf-compute/compute-candle"]
compute-burn = ["ucf-compute/compute-burn"]
llm-candle = ["ucf-compute/llm-candle"]
llm-burn = ["ucf-compute/llm-burn"]
sandbox-wasm = ["dep:wasmtime", "dep:wat"]
sandbox-proc = []
stage-isolation = []
gpu-cuda = ["dep:ucf-backends-gpu", "ucf-backends-gpu/gpu-cuda"]
gpu-metal = ["dep:ucf-backends-gpu", "ucf-backends-gpu/gpu-metal"]

[dependencies]
ucf-core = { path = "../../core/ucf-core" }
ucf-frames = { path = "../../domains/ucf-frames" }
ucf-biophys = { path = "../../domains/ucf-biophys" }
ucf-policy = { path = "../ucf-policy" }
ucf-brainbus = { path = "../../domains/ucf-brainbus" }
ucf-bluebrain-bridge = { path = "../../domains/ucf-bluebrain-bridge" }
ucf-ess = { path = "../../domains/ucf-ess" }
ucf-neuromod = { path = "../../domains/ucf-neuromod" }
ucf-onn = { path = "../../core/crates/ucf-onn" }
ucf-iit-proxy = { path = "../../domains/ucf-iit" }
ucf-snn = { path = "../../domains/ucf-snn" }
ucf-cde = { path = "../../core/crates/ucf-cde" }
ucf-nsr = { path = "../../core/crates/ucf-nsr" }
ucf-ssm = { path = "../../core/crates/ucf-ssm" }
ucf-dbm = { path = "../../domains/ucf-dbm" }
ucf-types = { path = "../../core/crates/ucf-types" }

ucf-fep = { path = "../../domains/ucf-fep" }

ucf-tcf = { path = "../../core/crates/ucf-tcf" }
ucf-spikes = { path = "../../core/ucf-spikes" }

ucf-sle = { path = "../../core/crates/ucf-sle" }
ucf-ncde = { path = "../../core/crates/ucf-ncde" }
ucf-compute = { path = "../ucf-compute" }
ucf-backends-gpu = { path = "../ucf-backends-gpu", optional = true }

blake3 = "1"
hex = { workspace = true }
wasmtime = { version = "25", optional = true, default-features = false, features = ["cranelift", "runtime"] }
wat = { version = "1", optional = true }

metrics = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
